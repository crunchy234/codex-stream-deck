<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent Display</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; padding: 14px; color: #d8d8d8; background: #2d2d2d; font-size: 12px; }
    label { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 8px; }
    input[type="checkbox"] { width: 17px; height: 17px; margin: 0; accent-color: #1683ff; }
    input[type="number"], select { box-sizing: border-box; width: 100%; min-height: 28px; color: #eee; background: #1e1e1e; border: 1px solid #555; border-radius: 3px; padding: 3px 6px; }
    fieldset { margin: 14px 0 0; padding: 10px; border: 1px solid #555; border-radius: 4px; }
    legend { padding: 0 4px; color: #eee; }
    .modifiers { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 10px; }
    .modifiers label { display: flex; align-items: center; gap: 6px; margin: 0; }
    p { margin: 12px 0 0; color: #a9a9a9; line-height: 1.35; }
    #shortcut-controls[hidden] { display: none; }
  </style>
</head>
<body>
  <label>
    <span>Context ring</span>
    <input id="show-context-rings" type="checkbox" checked>
  </label>
  <p>This global option applies to all six Codex agent keys on this computer.</p>
  <label>
    <span>Hold action</span>
    <select id="long-press-mode">
      <option value="codex-transcription">Codex transcription</option>
      <option value="off">Off</option>
      <option value="macos-shortcut">macOS custom shortcut</option>
    </select>
  </label>
  <fieldset id="shortcut-controls" hidden>
    <legend>macOS shortcut</legend>
    <label>
      <span>Key code</span>
      <input id="shortcut-key-code" type="number" min="0" max="127" step="1" inputmode="numeric" placeholder="Optional (0–127)">
    </label>
    <div class="modifiers">
      <label><input type="checkbox" data-modifier="left-option">Left Option</label>
      <label><input type="checkbox" data-modifier="right-option">Right Option</label>
      <label><input type="checkbox" data-modifier="left-command">Left Command</label>
      <label><input type="checkbox" data-modifier="right-command">Right Command</label>
      <label><input type="checkbox" data-modifier="left-control">Left Control</label>
      <label><input type="checkbox" data-modifier="right-control">Right Control</label>
      <label><input type="checkbox" data-modifier="left-shift">Left Shift</label>
      <label><input type="checkbox" data-modifier="right-shift">Right Shift</label>
    </div>
    <p>Choose a key code, one or more explicit modifiers, or both. Right Option is supported. Custom shortcuts run only on this Mac and require Accessibility permission.</p>
  </fieldset>
  <script>
    let websocket;
    let pluginContext;
    let globalSettings = {};

    window.connectElgatoStreamDeckSocket = (port, uuid, registerEvent) => {
      pluginContext = uuid;
      websocket = new WebSocket(`ws://127.0.0.1:${port}`);
      websocket.addEventListener("open", () => {
        websocket.send(JSON.stringify({ event: registerEvent, uuid }));
        websocket.send(JSON.stringify({ event: "getGlobalSettings", context: pluginContext }));
      });
      websocket.addEventListener("message", (message) => {
        const event = JSON.parse(message.data);
        if (event.event !== "didReceiveGlobalSettings") return;
        globalSettings = event.payload?.settings ?? {};
        document.getElementById("show-context-rings").checked = globalSettings.showContextRings !== false;
        const longPress = globalSettings.longPress ?? { mode: "codex-transcription" };
        document.getElementById("long-press-mode").value = longPress.mode ?? "codex-transcription";
        document.getElementById("shortcut-key-code").value = longPress.shortcut?.keyCode ?? "";
        for (const input of document.querySelectorAll("[data-modifier]")) {
          input.checked = (longPress.shortcut?.modifiers ?? []).includes(input.dataset.modifier);
        }
        updateShortcutControls();
      });
    };

    const sendGlobalSettings = () => {
      if (websocket?.readyState !== WebSocket.OPEN) return;
      websocket.send(JSON.stringify({
        event: "setGlobalSettings", context: pluginContext, payload: globalSettings
      }));
    };

    const updateShortcutControls = () => {
      const custom = document.getElementById("long-press-mode").value === "macos-shortcut";
      document.getElementById("shortcut-controls").hidden = !custom;
    };

    const updateLongPressSettings = () => {
      const mode = document.getElementById("long-press-mode").value;
      const keyCodeText = document.getElementById("shortcut-key-code").value.trim();
      const keyCode = keyCodeText === "" ? undefined : Number(keyCodeText);
      const modifiers = [...document.querySelectorAll("[data-modifier]:checked")].map((input) => input.dataset.modifier);
      const shortcut = {
        ...(Number.isInteger(keyCode) && keyCode >= 0 && keyCode <= 127 ? { keyCode } : {}),
        ...(modifiers.length ? { modifiers } : {})
      };
      globalSettings = { ...globalSettings, longPress: { mode, ...(Object.keys(shortcut).length ? { shortcut } : {}) } };
      updateShortcutControls();
      sendGlobalSettings();
    };

    document.getElementById("show-context-rings").addEventListener("change", (event) => {
      globalSettings = { ...globalSettings, showContextRings: event.target.checked };
      sendGlobalSettings();
    });

    document.getElementById("long-press-mode").addEventListener("change", updateLongPressSettings);
    document.getElementById("shortcut-key-code").addEventListener("change", updateLongPressSettings);
    for (const input of document.querySelectorAll("[data-modifier]")) input.addEventListener("change", updateLongPressSettings);
  </script>
</body>
</html>
